<main>
    <h1>Vote for your favourite contestant</h1>
    <p>Support your favourite Pageant contestant</p>
    <h2>Cast Your Vote</h2>

    <p>Choose the contestant you would like to support.</p>

    <form>
        <label for="name">Your Name:</label><br>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>
        <br><br>

        <label for="contestant">Select Contestant:</label><br>
        <select id="contestant" name="contestant" required>
            <option value="">Choose a contestant</option>
            <option value="contestant1">Contestant 1</option>
            <option value="contestant2">Contestant 2</option>
            <option value="contestant3">Contestant 3</option>
            <option value="contestant4">Contestant 4</option>
        </select>
        <br><br>

        <button type="submit">Submit Vote</button>
    </form>

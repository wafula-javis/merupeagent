</head>
<body class="register-page">

    <header>

    <nav>
        <a href="index.html">Home</a>

        <a href="events.html">Events</a>

    </nav>
    </header>
    <h1> Register for the Pageant Content</h1>
    <p>Join us and showcase your talent</p>

    <main>
        <h2>Registration Form</h2>
        <p>Fill in your details below to register.</p>

        <form action="#" method="post">
            <div class="form-row">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>
                   </div>
                   <div class="form-row">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
                   </div>

                   <div class="form-row">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>
                   </div>
                   <div class="form-row">

            <label for="age">Age:</label>
            <input type="number" id="age" name="age"
                   min="18" placeholder="Enter your age" required>
                   </div>
                   <div class="form-row">

            <label for="category">Registration Category:</label>
            <select id="category" name="category" required>
                <option value="">Select category</option>
                <option value="miss">Miss Pageant</option>
                <option value="mr">Mr Pageant</option>
                <option value="talent">Talent Contest</option>
            </select>
            </div>
            <div class="form-row">

            <label for="message">Why would you like to participate?</label>
            <textarea id="message" name="message" rows="4"
                      placeholder="Write your message"></textarea>
                      </div>

            <button type="submit" class="register-btn">Register Now</button>

        </form>

        <p><a class="back-home" href="index.html">Back to Home</a></p>
    </main>

    <footer>&copy; 2026 Mr and Miss Meru University</footer>
    
</body>
</html>
